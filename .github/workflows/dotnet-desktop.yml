# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: DCSRelay.slnx                                # Replace with your solution name, i.e. MyWpfApp.sln.
      Test_Project_Path: DCSRelay.Tests                           # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      Wap_Project_Directory: DCSRelay.Package                     # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      Wap_Project_Path: DCSRelay.Package\DCSRelay.Package.wapproj # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.
      Version: 1.0.${{ github.run_number }}                       # Replace with your application version, i.e. 1.0.${{ github.run_number }}.
      AppxVersion: 1.0.${{ github.run_number }}.0                 # Replace with your application version, i.e. 1.0.${{ github.run_number }}.0.

    steps:

    - name: Setup Windows SDK 17763
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
      with:
        # Pass the specific 5-digit build number (e.g., 22621, 26100, etc.)
        sdk-version: 17763

    - name: Setup Windows SDK 22621
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
      with:
        # Pass the specific 5-digit build number (e.g., 22621, 26100, etc.)
        sdk-version: 22621

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test DCSRelay.Tests

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:Version=$env:Version /p:VersionPrefix=$env:Version /p:AppxPackageVersion=$env:AppxVersion
      env:
        Configuration: ${{ matrix.configuration }}

    # Decode the base 64 encoded pfx and save the Signing_Certificate
    - name: Decode the pfx
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    # Update appxmanifest Identity version to match Version env variable
    - name: Update appxmanifest version
      run: |
        $manifestPath = Join-Path -Path $env:Wap_Project_Directory -ChildPath Package.appxmanifest
        [xml]$manifest = Get-Content $manifestPath
        $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
        $ns.AddNamespace("appx", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
        $identity = $manifest.SelectSingleNode("/appx:Package/appx:Identity", $ns)
        $identity.Version = $env:AppxVersion
        $manifest.Save($manifestPath)

    # Create the app package by building and packaging the Windows Application Packaging project
    - name: Create the app package
      run: msbuild $env:Wap_Project_Path /p:Configuration=$env:Configuration /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx /p:Version=$env:Version /p:ApplicationVersion=$env:Version /p:AppxPackageVersion=$env:AppxVersion
      env:
        Appx_Bundle: Always
        Appx_Bundle_Platforms: x86|x64
        Appx_Package_Build_Mode: StoreUpload
        Configuration: ${{ matrix.configuration }}
        PackageCertificatePassword: ${{ secrets.Pfx_Key }}

    # Remove the pfx
    - name: Remove the pfx
      run: Remove-Item -path $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx


    # Upload the MSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DCSRelay-${{env.Version}}-msix-${{matrix.configuration}}
        path: ${{ env.Wap_Project_Directory }}\AppPackages

    # Build normal zip file
    - name: Build Zip file ${{ matrix.configuration }}
      env:
        Configuration: ${{ matrix.configuration }}
      run: |
        dotnet publish DCSRelay --configuration $env:Configuration --output DCSRelay\bin\${{ matrix.configuration}}\net10.0-windows --self-contained true /p:PublishSingleFile=false /p:PublishTrimmed=false /p:PublishReadyToRun=true /p:Version=$env:Version /p:VersionPrefix=$env:Version

    # Publish zip file
    - name: Upload ${{ matrix.configuration }} Zip file
      uses: actions/upload-artifact@v4
      with:
        name: DCSRelay-${{ env.Version }}-${{matrix.configuration}}
        path: DCSRelay\bin\${{matrix.configuration}}\net10.0-windows
