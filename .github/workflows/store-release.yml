name: Store Release

on:
  workflow_run:
    workflows: ["CI Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: store-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release-and-submit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest

    steps: 
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Resolve store release artifact metadata
      id: artifact_meta
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const run_id = context.payload.workflow_run.id;

          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner,
            repo,
            run_id,
            per_page: 100
          });

          const artifact = artifacts.find(a => /^DCSRelay-(.+)-msix-Release$/.test(a.name));
          if (!artifact) {
            core.setFailed('Could not find Release MSIX artifact from dotnet-desktop workflow run.');
            return;
          }

          const versionMatch = artifact.name.match(/^DCSRelay-(.+)-msix-Release$/);
          const version = versionMatch?.[1] ?? `${context.payload.workflow_run.run_number}`;

          core.setOutput('artifact_name', artifact.name);
          core.setOutput('version', version);

    - name: Resolve standalone release artifact metadata
      id: artifact_meta
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const run_id = context.payload.workflow_run.id;

          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner,
            repo,
            run_id,
            per_page: 100
          });

          const artifact = artifacts.find(a => /^DCSRelay-(\d+)\.(\d+)\.(\d+)-Release$/.test(a.name));
          if (!artifact) {
            core.setFailed('Could not find Release artifact from dotnet-desktop workflow run.');
            return;
          }

          const versionMatch = artifact.name.match(/^DCSRelay-(\d+)\.(\d+)\.(\d+)-Release$/);
          const version = versionMatch?.[1] ?? `${context.payload.workflow_run.run_number}`;

          core.setOutput('standalone_artifact_name', artifact.name);
          core.setOutput('standalone_version', version);


    - name: Download Release MSIX artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        run_id: ${{ github.event.workflow_run.id }}
        name: ${{ steps.artifact_meta.outputs.artifact_name }}
        path: artifacts
        if_no_artifact_found: fail

    - name: Download Release Standalone artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        run_id: ${{ github.event.workflow_run.id }}
        name: ${{ steps.artifact_meta.outputs.standalone_artifact_name }}
        path: artifacts
        if_no_artifact_found: fail
        skip_unpack: true

    - name: Locate package file
      shell: pwsh
      run: |
        $preferred = Get-ChildItem -Path artifacts -Recurse -File -Include *.appxupload,*.msixupload | Select-Object -First 1
        if ($null -ne $preferred) {
          $package = $preferred
        } else {
          $package = Get-ChildItem -Path artifacts -Recurse -File -Include *.appxbundle,*.msixbundle,*.appx,*.msix | Select-Object -First 1
        }

        if ($null -eq $package) {
          throw 'No .appxupload, .msixupload, .appxbundle, .msixbundle, .appx, or .msix package found in downloaded artifacts.'
        }

        "PACKAGE_PATH=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PACKAGE_DIRECTORY=$($package.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Locate release file
      shell: pwsh
      run: |
        $package = Get-ChildItem -Path artifacts -Recurse -File -Include *.zip | Select-Object -First 1

        if ($null -eq $package) {
          throw 'No .zip package found in downloaded artifacts.'
        }

        "RELEASE_PATH=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_DIRECTORY=$($package.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.artifact_meta.outputs.version }}
        name: DCSRelay v${{ steps.artifact_meta.outputs.version }}
        generate_release_notes: true
        files: ${{ env.RELEASE_PATH }}
 
    - name: Configure Microsoft Store CLI 
      uses: microsoft/microsoft-store-apppublisher@v1.1 
 
    - name: Reconfigure store credentials 
      run: msstore reconfigure ` 
              --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} ` 
              --sellerId ${{ secrets.SELLER_ID }} ` 
              --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} ` 
              --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }} 
 
    - name: Publish App package 
      run: msstore publish DCSRelay.Package --inputDirectory "$env:PACKAGE_DIRECTORY" -id 9PH7HVJPN8B1
